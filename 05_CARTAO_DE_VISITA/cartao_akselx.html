<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cartão de Visita — AKSEL X (P04)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#DFE3E9;font-family:'Inter',Arial,sans-serif}
  .sheet{width:1000px;margin:30px auto;display:flex;gap:40px;flex-wrap:wrap}
  .card{width:455px;height:264px;border-radius:16px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(10,15,30,.28)}
  .front{background:linear-gradient(130deg,#0A0F1E 0%,#12224D 60%,#1A5CFF 150%);color:#fff}
  .front .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:34px 34px}
  .front .x{position:absolute;right:-70px;top:-70px;font-family:'Archivo',sans-serif;font-weight:800;font-size:290px;opacity:.06;line-height:1}
  .lock{position:absolute;left:34px;top:24px;display:flex;align-items:center;gap:14px}
  .lock svg{width:52px;height:52px}
  .lock b{font-family:'Archivo',sans-serif;font-size:23px;letter-spacing:.5px}
  .lock b span{color:#8FB0FF}
  .tag{position:absolute;left:34px;bottom:34px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#C6D6FF}
  .role{position:absolute;right:34px;bottom:34px;font-size:15px;color:#7FA3FF;letter-spacing:1px}
  .back{background:#0A0F1E;color:#EAF0FF;display:flex;flex-direction:column;gap:7px;justify-content:center;padding-left:120px}
  .back .corner{position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border:14px solid #1A5CFF;border-radius:34px;opacity:.12;transform:rotate(45deg)}
  .back .nm{font-family:'Archivo',sans-serif;font-size:25px;font-weight:800;color:#fff}
  .back .r1{font-size:14px;color:#8FB0FF;margin-bottom:6px}
  .back .ln{font-size:15px;color:#B6C6E8}
  .back .ln b{color:#fff;font-weight:600}
  @media print{ body{background:#fff} .card{margin:0;box-shadow:none;page-break-inside:avoid} .sheet{width:100%;margin:0;gap:0} }
</style>
</head>
<body>
<div class="sheet">
  <!-- FRENTE -->
  <div class="card front">
    <div class="grid"></div>
    <div class="x">X</div>
    <div class="lock">
      <svg viewBox="0 0 120 120"><rect x="10" y="10" width="100" height="100" rx="24" fill="#1A5CFF"/><g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"><line x1="34" y1="34" x2="86" y2="86"/><line x1="86" y1="34" x2="34" y2="86"/></g><rect x="54" y="54" width="12" height="12" rx="3" fill="#FFFFFF"/></svg>
      <b>AKSEL <span>X</span></b>
    </div>
    <div class="tag">Tecnologia · IA · Transformação</div>
    <div class="role">Eixo da sua operação</div>
  </div>
  <!-- VERSO -->
  <div class="card back">
    <div class="corner"></div>
    <div class="nm">Fulano de Tal</div>
    <div class="r1">Diretor de Sistemas e Dados</div>
    <div class="ln"><b>+55 (11) 90000-0000</b></div>
    <div class="ln">fulano@akselx.com.br</div>
    <div class="ln">www.akselx.com.br · São Paulo — SP</div>
    <svg style="position:absolute;left:34px;top:96px" width="58" height="58" viewBox="0 0 120 120"><rect x="10" y="10" width="100" height="100" rx="24" fill="#1A5CFF"/><g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"><line x1="34" y1="34" x2="86" y2="86"/><line x1="86" y1="34" x2="34" y2="86"/></g><rect x="54" y="54" width="12" height="12" rx="3" fill="#fff"/></svg>
  </div>
</div>
</body>
</html>
